<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elieverdle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="ssonik.webp">
    <meta property="og:title" content="Elieverdle">
    <meta property="og:description" content="Guess the character!">
    <meta property="og:image" content="https://kuurp.github.io/Elieverdle/ssonik.webp">
    <meta property="og:url" content="https://kuurp.github.io/Elieverdle/">
    <meta property="og:type" content="website">

    <!-- Bonjour dos! -->
</head>

<body>
    <audio id="dragoncoin" src="dragon-coin.ogg" preload="auto"></audio>
    <div id="yoshicoin-count" style="position: absolute;"><p></p></div>
    <div id="shop">
        <h2 style="margin-top:0;">Shop</h2>
        <div id="factory-section">
            <div id="factory-info">
                <span id="factory-status">Factory: Not owned</span><br>
                <span id="factory-upgrade">Upgrade: N/A</span>
            </div>
            <button id="buy-factory-btn">Buy Factory (100 Yoshicoins)</button>
            <button id="upgrade-factory-btn" style="display:none;">Upgrade Factory (200 Yoshicoins)</button>
        </div>
    </div>
    <h1 class="outline">Elieverdle</h1>
    <div id="input-container">
        <div id="input-wrapper">
            <input type="text" placeholder="Type character name">
            <div id="suggestions"></div>
        </div>
    </div>
    <div id="results">
        <div id="header" style="display: none;">
            <div class="name outline">Name</div>
            <div class="species outline">Species</div>
            <div class="height outline">Height</div>
            <div class="position outline">Likes Pacoca</div>
        </div>
        <div id="rows">
            <!--div class="row">
                <div class="name">Name</div>
                <div class="species">Species</div>
                <div class="height">Height</div>
                <div class="position">Likes Pacoca</div>
            </div-->
        </div>
    </div>
    <div id="win" style="display: none;">

    </div>

    <!-- button id="debugReset" style="margin-top: 30px; display:block; margin-left: auto; margin-right: auto;">Clear localStorage & refresh</button>
    <script>
        const debugResetBtn = document.getElementById('debugReset');

        debugResetBtn.addEventListener('click', () => {
            localStorage.clear();
            location.reload();
        });
    </script -->
    

    <!-- Shop/factory logic must be loaded after DOM is ready -->
    <script src="script.js"></script>
    <script src="shop-factory.js"></script>

    <script>
        function getYoshicoinCount() {
            return parseInt(localStorage.getItem('yoshicoinCount')) || 0;
        }
        let yoshicoinDivs = [];
        let yoshicoins = getYoshicoinCount();

        function isDragoncoinMode() {
            // player finished today's elieverdle and the answer is "Miya" // lol
            const playerData = JSON.parse(localStorage.getItem('elieverdle_playerData') || '{}');
            const todaysSeed = getSeed();
            const todayData = playerData[todaysSeed];
            
            if (!todayData || !todayData.win) {
                return false;
            }
            
            if (!data) return false;
            const todaysCharIndex = todaysSeed % data.length;
            return data[todaysCharIndex].name === 'Pudding';
        }

        function updateYoshicoinDisplay() {
            yoshicoins = parseInt(localStorage.getItem('yoshicoinCount')) || 0;
            const coinName = isDragoncoinMode() ? 'Yoshicoins' : 'Dragoncoins';
            const yoshicoinCountDiv = document.getElementById('yoshicoin-count');
            if (yoshicoinCountDiv) {
                yoshicoinCountDiv.querySelector('p').textContent = `${coinName}: ${yoshicoins}`;
            }
        }

        function addYoshicoin() {
            const isDragon = isDragoncoinMode();
            const coinName = isDragon ? 'Dragoncoin' : 'Yoshicoin';
            const coinImage = 'yoshicoin.webp';
            
            const yoshicoin = document.createElement('img');
            yoshicoin.src = coinImage;
            yoshicoin.classList.add('yoshicoin');
            yoshicoin.style.position = 'absolute';
            yoshicoin.style.left = Math.random() * (window.innerWidth - 50) + 'px';
            yoshicoin.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            yoshicoin.style.width = '50px';
            yoshicoin.style.imageRendering = 'pixelated';

            let ycA = document.createElement('a');
            ycA.appendChild(yoshicoin);
            ycA.style.cursor = 'pointer';
            ycA.addEventListener('click', () => {
                const posLeft = yoshicoin.style.left;
                const posTop = yoshicoin.style.top;

                const sound = document.getElementById('dragoncoin');
                if (sound) {
                    sound.currentTime = 0;
                    sound.play();
                }
                
                yoshicoins++;
                localStorage.setItem('yoshicoinCount', yoshicoins);
                updateYoshicoinDisplay();
                ycA.parentNode.removeChild(ycA);
                yoshicoinDivs = yoshicoinDivs.filter(div => div !== ycA);
                const textDiv = document.createElement('div');
                const currentCoinName = isDragoncoinMode() ? 'Dragoncoin' : 'Yoshicoin';
                textDiv.textContent = `+1 ${currentCoinName}`;
                textDiv.style.position = 'absolute';
                textDiv.style.left = posLeft;
                textDiv.style.top = posTop;
                textDiv.style.color = 'yellow';
                textDiv.style.fontWeight = 'bold';
                textDiv.style.textShadow = '-1px -1px 0 black , 1px -1px 0 black, -1px 1px 0 black, 1px 1px 0 black';
                document.body.appendChild(textDiv);

                setTimeout(() => {
                    if (textDiv.parentNode) {
                        textDiv.parentNode.removeChild(textDiv);
                    }
                }, 1000);
            });
            document.body.appendChild(ycA);
            yoshicoinDivs.push(yoshicoin);

            setTimeout(() => {
                if (yoshicoin.parentNode) {
                    yoshicoin.parentNode.removeChild(yoshicoin);
                    yoshicoinDivs = yoshicoinDivs.filter(div => div !== yoshicoin);
                }
            }, 5000);
        }

        setInterval(() => {
            if (Math.random() < 0.2) {
                addYoshicoin();
            }
        }, 1000);
        setTimeout(updateYoshicoinDisplay, 100);
        setTimeout(updateYoshicoinDisplay, 1000);
        setTimeout(updateYoshicoinDisplay, 10000);
    </script>
</body>

</html>
